<script>
  document.addEventListener('click', function(e) {
    let el = e.target;
    while(el) {
      if (el.textContent && el.textContent.includes('Get Started')) {
        window.parent.postMessage({ type: 'NAVIGATE', path: '/login' }, '*');
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (el.textContent && el.textContent.includes('Browse Events')) {
        window.parent.postMessage({ type: 'NAVIGATE', path: '/student/dashboard' }, '*');
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (el.tagName === 'A' && el.getAttribute('href')) {
        let href = el.getAttribute('href');
        if (href.startsWith('/')) {
            window.parent.postMessage({ type: 'NAVIGATE', path: href }, '*');
            e.preventDefault();
            e.stopPropagation();
            return;
        }
      }
      el = el.parentElement;
    }
  }, true);
</script>
