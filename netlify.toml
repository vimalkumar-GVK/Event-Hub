[build]
  publish = "public"
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[functions.main]
  runtime = "python"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/main"
  status = 200

# Security: Block access to sensitive files and source code
[[redirects]]
  from = "/*.db"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true
