version: '3.8'

# ============================================================
# LOCAL DEVELOPMENT — all services in one compose file
# For production, use backend/docker-compose.yml and
# frontend/docker-compose.yml separately.
# ============================================================

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    networks:
      - campus-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""   # empty = use nginx proxy (recommended for local dev)
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - NGINX_BACKEND_URL=http://backend:8000
    networks:
      - campus-net

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: campusdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus-net

  redis:
    image: redis:7
    networks:
      - campus-net

networks:
  campus-net:
    driver: bridge

volumes:
  postgres_data:
